<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GibGib Sim — веб-версия офлайн-симулятора листогибочного пресса 3.4.0. Работает в любом браузере.">
<title>GibGib Sim 3.4.0 — Web Edition</title>
<style>
:root{
  --bg:#17181a; --bg2:#1e2023; --card:#24262a; --card2:#2b2e33;
  --text:#f2f3f4; --text2:#9aa0a6; --accent:#ff6b00; --accentSoft:#ffab69;
  --metal:#f26a00; --metalLine:#ffc08a; --steel:#4a5158; --steel2:#666e76;
  --steelLine:#9aa4ae; --dim:#7f8790; --line:#34373c; --ok:#4caf50; --warn:#ffb300; --fail:#f44336;
}
:root[data-theme="light"]{
  --bg:#eef0f2; --bg2:#f7f8f9; --card:#ffffff; --card2:#eceff2;
  --text:#1b1d1f; --text2:#5c636b; --accent:#e05e00; --accentSoft:#a64a00;
  --metal:#f26a00; --metalLine:#b34a00; --steel:#8d959d; --steel2:#aeb6be;
  --steelLine:#5c646c; --dim:#8a929a; --line:#d6dade;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Arial,sans-serif;overflow:hidden}
header{height:62px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:8px;height:34px;background:var(--accent);border-radius:4px;flex:none}
.brand h1{font-size:17px;letter-spacing:.3px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--accent);font-size:10px;letter-spacing:1.6px}
.badge{border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:4px 10px;font-size:11px;white-space:nowrap}
.spacer{flex:1}
button,.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;font:inherit}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.mini{padding:3px 9px;font-size:12px}
nav{display:flex;gap:4px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 14px;white-space:nowrap;color:var(--text2)}
.tab.active{color:var(--text);border-color:var(--line);background:var(--card)}
main{height:calc(100% - 116px);overflow:auto;padding:18px}
.panel{display:none;max-width:1400px;margin:0 auto}
.panel.active{display:block}
.grid2{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{margin:0 0 12px;font-size:15px;color:var(--accent)}
label{display:block;color:var(--text2);font-size:12px;margin-bottom:10px}
input,select{display:block;width:100%;margin-top:5px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit}
select{cursor:pointer}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row-head,.dimrow{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.row-head{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.row-head b:first-child{grid-column:1/3}
.tag{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--accent);color:var(--accent);border-radius:50%;font-weight:700;font-size:12px}
.sep{height:1px;background:var(--line);margin:14px 0}
.scene-wrap{position:relative}
.canvas{width:100%;height:min(62vh,600px);display:none;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.canvas.active{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.status{display:flex;flex-direction:column;padding:10px 14px;border-radius:9px;border-left:4px solid var(--ok);background:var(--card2);margin-top:12px}
.status span{color:var(--text2);font-size:12px}
.status.warn{border-left-color:var(--warn)} .status.fail{border-left-color:var(--fail)}
.seq{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card2);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.seq.active{border-color:var(--accent)}
.seq b{margin-left:auto;color:var(--accent)}
.tool{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--card2);border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer}
.tool.sel{border-color:var(--accent);background:rgba(255,107,0,.12)}
.star{background:none;border:none;color:var(--dim);padding:0 4px;font-size:17px}
.star.on{color:var(--accent)}
.tname{flex:1} .tmeta{color:var(--text2);font-size:11px}
.list{max-height:300px;overflow:auto;padding-right:4px}
.muted{color:var(--text2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--text2);font-weight:600}
.big{font-size:30px;color:var(--accent);font-weight:700}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.gallery figure{margin:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gallery img{width:100%;height:130px;object-fit:cover;display:block;background:#111}
.gallery figcaption{padding:7px 9px;font-size:11px;color:var(--text2)}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero img{max-width:340px;width:100%;border-radius:10px;border:1px solid var(--line)}
.hero h2{font-size:26px;margin:0 0 8px}
.hero p{color:var(--text2);max-width:560px}
.note{border-left:3px solid var(--accent);padding:10px 14px;background:var(--card2);color:var(--text2);margin-top:14px}
a{color:var(--accentSoft)}
@media print{
  body{overflow:visible;background:#fff;color:#000}
  header,nav,.toolbar,.no-print{display:none!important}
  main{height:auto;padding:0;overflow:visible}
  .panel{display:none!important}.panel#panel-docs{display:block!important}
  .card{border:none;padding:0}
  #drawingCanvas{width:100%;height:auto}
}
</style>
</head>

<header>
  <div class="brand"><div class="mark"></div><div><h1 data-i18n="appTitle"></h1><small data-i18n="subTitle"></small></div></div>

  <div class="spacer"></div>
  <button id="btnTheme" title="Theme">◐</button>
  <button id="btnLang">EN</button>
</header>

  <button class="tab" data-tab="tools" data-i18n="tabTools"></button>
  <button class="tab" data-tab="calc" data-i18n="tabCalc"></button>
  <button class="tab" data-tab="docs" data-i18n="tabDocs"></button>
</nav>

  <!-- ДЕТАЛЬ -->
  <section class="panel" id="panel-part">
    <div class="grid2">
      <div class="card">
        <h2 data-i18n="profile"></h2>
        <label><span data-i18n="profile"></span><select id="profileSel"></select></label>
        <div id="profileInputs"></div>
      </div>
      <div class="scene-wrap">
        <div class="toolbar">
          <button id="view2d" data-setview="2d" data-i18n="view2d"></button>
          <button id="view3d" class="primary" data-setview="3d" data-i18n="view3d"></button>
        </div>
        <canvas class="canvas scene-canvas active" data-view="3d" id="scene3d"></canvas>
        <canvas class="canvas scene-canvas" data-view="2d" id="scene2d"></canvas>
      </div>
    </div>
  </section>

  <!-- ГИБКА -->
  <section class="panel" id="panel-bend">
    <div class="grid2">
      <div class="card">
        <h2 data-i18n="sequence"></h2>
        <div class="toolbar">
          <button id="btnSim" class="primary" data-i18n="simulate"></button>
          <button id="btnStop" data-i18n="stop"></button>
          <button id="btnAutoSeq" data-i18n="autoSequence"></button>
        </div>
        <div id="sequenceList"></div>
        <div class="sep"></div>
        <h2 data-i18n="mach"></h2>
        <label><span data-i18n="vOpening"></span><input id="mV" type="number" value="12" oninput="state.machine.V=+this.value;renderScene()"></label>
        <label><span data-i18n="ramTravel"></span><input id="mRam" type="number" value="80" oninput="state.machine.ram=+this.value"></label>
        <label><span data-i18n="gauge"></span><input id="mGauge" type="number" value="30" oninput="state.machine.gauge=+this.value;renderStatus()"></label>
        <div id="statusBox" class="status"></div>
      </div>
      <div class="scene-wrap">
        <div class="toolbar">
          <button id="view2dB" data-setview="2d" data-i18n="view2d"></button>
          <button id="view3dB" class="primary" data-setview="3d" data-i18n="view3d"></button>
        </div>
        <canvas class="canvas scene-canvas active" data-view="3d" id="sceneBend3d"></canvas>
        <canvas class="canvas scene-canvas" data-view="2d" id="sceneBend2d"></canvas>
        <div class="card" style="margin-top:12px">
          <p style="color:var(--text2)"><b data-i18n="step"></b> — 2D/3D-анимация каждого гиба: укладка, подвод пуансона, гибка, отвод.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ИНСТРУМЕНТ -->
  <section class="panel" id="panel-tools">
    <div class="card">
      <h2 data-i18n="tooling"></h2>
      <div class="toolbar">
        <button id="btnAutoTools" class="primary" data-i18n="autoTools"></button>
        <label style="display:flex;align-items:center;gap:6px;margin:0"><input id="favOnly" type="checkbox" style="width:auto;margin:0"><span data-i18n="favouritesOnly"></span></label>
      </div>
      <div class="grid2">
        <div>
          <h3 data-i18n="punch"></h3>
          <input id="punchSearch" type="search" placeholder="поиск / search">
          <div class="list" id="punchList"></div>
        </div>
        <div>
          <h3 data-i18n="die"></h3>
          <input id="dieSearch" type="search" placeholder="поиск / search">
          <div class="list" id="dieList"></div>
        </div>
      </div>
      <div id="statusBoxTools"></div>
    </div>
  </section>

  <!-- РАСЧЁТ -->
  <section class="panel" id="panel-calc">
    <div class="card">
      <h2 data-i18n="flatPattern"></h2>
      <p><span data-i18n="totalLength"></span>: <span class="big" id="totalLen"></span></p>
      <table id="calcTable"></table>
      <div class="sep"></div>
      <h2 data-i18n="reverseK"></h2>

let LANG = 'ru', THEME = 'dark';
function t(k) { return (I18N[LANG] && I18N[LANG][k]) || k; }
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.documentElement.lang = LANG;
  document.getElementById('btnLang').textContent = LANG === 'ru' ? 'EN' : 'RU';
  renderProfileInputs(); renderTools(); renderCalc(); renderStatus();
}

/* ---------- состояние ---------- */
const PROFILES = {
  angle:  { ru:'Уголок',            en:'Angle',           dims:['a','b'],           bends:[[90, 1]] },
  hem:    { ru:'Уголок с подгибом', en:'Hemmed angle',    dims:['a','b','c'],       bends:[[150,1],[180,1]] },
  u:      { ru:'П-профиль / швеллер', en:'U / channel',   dims:['a','b','c'],       bends:[[90,1],[90,1]] },
  c:      { ru:'C-профиль / короб', en:'C / box',         dims:['a','b','c','d'],   bends:[[90,1],[90,1],[90,1]] },
  g:      { ru:'G-профиль',          en:'G-profile',      dims:['a','b','c','d'],   bends:[[90,1],[90,1],[-90,1]] },
  z:      { ru:'Z / S-профиль',      en:'Z / S-profile',  dims:['a','b','c'],       bends:[[90,1],[90,-1]] },
  omega:  { ru:'Омега-профиль',      en:'Omega profile',  dims:['a','b','c','d','e'],bends:[[90,1],[90,1],[90,1],[90,1]] },
  step:   { ru:'Профиль со ступенями', en:'Stepped profile', dims:['a','b','c'],    bends:[[90,1],[90,-1]] },
};

const state = {
  profile: 'angle',
  dims: [80, 60, 50, 40, 30],
  angles: [90, 90, 90, 90],
  s: 2, R: 2, K: 0.42, L: 400,
  view: '3d', yaw: 0.7, zoom: 1, panX: 0, panY: 0,
  anim: { active: false, index: 0, progress: 0, raf: null },
  favourites: new Set(), favOnly: false,
  punch: null, die: null,
  machine: { V: 12, ram: 80, gauge: 30 },
  tab: 'part',
};

function profile() { return PROFILES[state.profile]; }
function bendCount() { return profile().bends.length; }
function activeDims() { return state.dims.slice(0, bendCount() + 1); }
function activeAngles() { return state.angles.slice(0, bendCount()); }

/* ---------- геометрия ---------- */
function centerline(anglesOverride) {
  const dims = activeDims(), bends = profile().bends;
  const angs = anglesOverride || activeAngles();
  let pts = [{ x: 0, y: 0 }];
  let dir = 0;
  pts.push({ x: dims[0], y: 0 });
  for (let i = 0; i < bends.length; i++) {
    const [A, sign] = bends[i];
    const a = angs[i] === undefined ? A : angs[i];
    dir += sign * (180 - a) * Math.PI / 180;
    const last = pts[pts.length - 1], len = dims[i + 1] || 0;
    pts.push({ x: last.x + Math.cos(dir) * len, y: last.y + Math.sin(dir) * len });
  }
  return pts;
}

function offsetPolyline(pts, dist) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const prev = pts[Math.max(0, i - 1)], cur = pts[i], next = pts[Math.min(pts.length - 1, i + 1)];
    const v1 = { x: cur.x - prev.x, y: cur.y - prev.y };
    const v2 = { x: next.x - cur.x, y: next.y - cur.y };
    const n1 = norm({ x: -v1.y, y: v1.x }), n2 = norm({ x: -v2.y, y: v2.x });
    let mx = n1.x + n2.x, my = n1.y + n2.y;
    const m = norm({ x: mx, y: my });
    const dot = m.x * n1.x + m.y * n1.y;
    const scale = dist / (Math.abs(dot) < 0.2 ? 1 : dot);
    out.push({ x: cur.x + m.x * scale, y: cur.y + m.y * scale });
  }
  return out;
}
function norm(v) { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; }
function polygonPath(ctx, pts) {
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
}

/* ---------- утилиты canvas ---------- */
function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: r.width, h: r.height };
}
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function fitTransform(pts, w, h, pad) {
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  pts.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });
  const sx = (w - pad * 2) / Math.max(1, maxX - minX), sy = (h - pad * 2) / Math.max(1, maxY - minY);
  const s = Math.min(sx, sy) * (state.zoom || 1);
  return { s, ox: w / 2 - (minX + maxX) / 2 * s + state.panX, oy: h / 2 + (minY + maxY) / 2 * s + state.panY };
}
function project(p, tr) { return { x: tr.ox + p.x * tr.s, y: tr.oy - p.y * tr.s }; }

/* ---------- 2D-отрисовка ---------- */
function draw2D(canvas, anglesOverride) {
  const { ctx, w, h } = setupCanvas(canvas);
  const bg = css('--bg2'); ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  drawGrid(ctx, w, h);
  const cl = centerline(anglesOverride);
  const outer = offsetPolyline(cl, state.s / 2), inner = offsetPolyline(cl, -state.s / 2);
  const tr = fitTransform(cl, w, h, 90);
  const ptsO = outer.map(p => project(p, tr)), ptsI = inner.map(p => project(p, tr));
  const ptsC = cl.map(p => project(p, tr));

  // матрица под активным гибом
  const bi = state.anim.active ? state.anim.index : 0;
  const bendP = ptsC[Math.min(bi + 1, ptsC.length - 1)] || ptsC[1];
  drawDie2D(ctx, bendP, tr);
  drawPunch2D(ctx, bendP, tr, state.anim.active ? state.anim.progress : 0);

  // лист
  polygonPath(ctx, ptsO.concat(ptsI.slice().reverse()));
  ctx.fillStyle = css('--metal'); ctx.fill();
  ctx.strokeStyle = css('--metalLine'); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ptsO[0].x, ptsO[0].y);
  ptsO.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = css('--accentSoft'); ctx.lineWidth = 2; ctx.stroke();

  // размеры и буквы гибов
  ctx.font = '600 14px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 1; i < ptsC.length - 1; i++) {
    const p = ptsC[i];
    ctx.beginPath(); ctx.arc(p.x, p.y - 26, 13, 0, Math.PI * 2);
    ctx.fillStyle = css('--bg2'); ctx.fill(); ctx.strokeStyle = css('--accent'); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = css('--accent'); ctx.fillText(String.fromCharCode(64 + i), p.x, p.y - 26);
  }
  ctx.strokeStyle = css('--dim'); ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(ptsC[0].x, ptsC[0].y + 40); ctx.lineTo(ptsC[ptsC.length - 1].x, ptsC[ptsC.length - 1].y + 40); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = css('--text2'); ctx.font = '12px Segoe UI, sans-serif';
  ctx.fillText('s = ' + state.s + '  ·  R = ' + state.R + '  ·  L = ' + state.L, w / 2, h - 18);
}

function drawGrid(ctx, w, h) {
  ctx.strokeStyle = 'rgba(140,150,160,.07)'; ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
}
function drawDie2D(ctx, p, tr) {
  const v = (state.die ? state.die.V : state.machine.V) * tr.s;
  ctx.fillStyle = css('--steel');
  ctx.beginPath();
  ctx.moveTo(p.x - v, p.y + 26); ctx.lineTo(p.x - 14, p.y + 26);
  ctx.lineTo(p.x, p.y + 66); ctx.lineTo(p.x + 14, p.y + 26);
  ctx.lineTo(p.x + v, p.y + 26); ctx.lineTo(p.x + v, p.y + 90);
  ctx.lineTo(p.x - v, p.y + 90); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = css('--steelLine'); ctx.lineWidth = 1.5; ctx.stroke();
}
function drawPunch2D(ctx, p, tr, progress) {
  const drop = progress * 55;
  ctx.fillStyle = css('--steel2');
  ctx.beginPath();
  ctx.moveTo(p.x - 26, p.y - 150 + drop); ctx.lineTo(p.x + 26, p.y - 150 + drop);
  ctx.lineTo(p.x + 9, p.y - 32 + drop); ctx.lineTo(p.x - 9, p.y - 32 + drop); ctx.closePath();
  ctx.fill(); ctx.strokeStyle = css('--steelLine'); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = css('--steel'); ctx.fillRect(p.x - 40, p.y - 156 + drop, 80, 8);
}

/* ---------- 3D-отрисовка ---------- */
function isoProject(p, yaw, s, ox, oy) {
  const c = Math.cos(yaw), sn = Math.sin(yaw);
  const x = p.x * c - p.z * sn, z = p.x * sn + p.z * c;
  const sx = (x - p.y) * 0.866, sy = (x + p.y) * 0.5;
  return {
    x: ox + (sx + (p.zAxis || 0) * 0.5) * s,
    y: oy + (sy - (p.zAxis || 0) * 0.866) * s,
    depth: z + p.y
  };
}
function draw3D(canvas, anglesOverride) {
  const { ctx, w, h } = setupCanvas(canvas);
  ctx.fillStyle = css('--bg2'); ctx.fillRect(0, 0, w, h);
  drawGrid(ctx, w, h);
  const cl = centerline(anglesOverride);
  const outer = offsetPolyline(cl, state.s / 2), inner = offsetPolyline(cl, -state.s / 2);
  const half = state.L / 2;
  const yaw = state.yaw, zoom = state.zoom;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  cl.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });
  const cx = maxX - minX, cy = maxY - minY;
  const scW = (w - 90) / (0.866 * (cx + cy) + 0.5 * state.L + 1);
  const scH = (h - 90) / (0.5 * (cx + cy) + 0.866 * state.L + 1);
  const scale = Math.max(0.05, Math.min(scW, scH) * zoom);
  const ox = w / 2 + state.panX, oy = h / 2 + state.panY;

  const V = (p, zAxis) => ({ x: p.x, y: p.y, z: 0, zAxis, depth: 0 });
  const faces = [];
  const shade = (base, k) => {
    const col = base.match(/\w\w/g).map(x => parseInt(x, 16));
    return 'rgb(' + col.map(c => Math.max(0, Math.min(255, Math.round(c * k)))).join(',') + ')';
  };
  const addFace = (pts3, color, k) => {
    const proj = pts3.map(p => isoProject(p, yaw, scale, ox, oy));
    const depth = proj.reduce((a, p) => a + p.depth, 0) / proj.length;
    faces.push({ proj, color: shade(color, k), depth });
  };
  const baseCol = css('--metal').replace('#', '');

  for (let i = 0; i < outer.length - 1; i++) {
    addFace([V(outer[i], -half), V(outer[i + 1], -half), V(outer[i + 1], half), V(outer[i], half)], baseCol, 1.0);
    addFace([V(inner[i], -half), V(inner[i + 1], -half), V(inner[i + 1], half), V(inner[i], half)], baseCol, 0.62);
  }
  addFace(outer.map(p => V(p, half)).concat(inner.slice().reverse().map(p => V(p, half))), baseCol, 1.18);
  addFace(outer.map(p => V(p, -half)).concat(inner.slice().reverse().map(p => V(p, -half))), baseCol, 0.5);

  faces.sort((a, b) => a.depth - b.depth);
  faces.forEach(f => {
    polygonPath(ctx, f.proj.map(p => ({ x: p.x, y: p.y })));
    ctx.fillStyle = f.color; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1; ctx.stroke();
  });

  // линии гибов
  ctx.strokeStyle = css('--accentSoft'); ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
  cl.slice(1, -1).forEach(p => {
    const a = isoProject(V(p, -half), yaw, scale, ox, oy), b = isoProject(V(p, half), yaw, scale, ox, oy);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
  ctx.setLineDash([]);

  // станок у активного гиба
  const bi = state.anim.active ? state.anim.index : 0;
  const bp = cl[Math.min(bi + 1, cl.length - 1)] || cl[1];
  const Vw = (state.die ? state.die.V : state.machine.V);
  const tw = 40;
  const diePts = [
    { x: bp.x - Vw, y: bp.y - 22, z: 0, zAxis: -tw }, { x: bp.x + Vw, y: bp.y - 22, z: 0, zAxis: -tw },
    { x: bp.x + Vw, y: bp.y + 22, z: 0, zAxis: tw }, { x: bp.x - Vw, y: bp.y + 22, z: 0, zAxis: tw }
  ].map(p => isoProject(p, yaw, scale, ox, oy));
  polygonPath(ctx, diePts); ctx.fillStyle = 'rgba(90,98,106,.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(170,180,190,.35)'; ctx.stroke();
  const drop = (state.anim.active ? state.anim.progress : 0) * 60;
  const punchPts = [
    { x: bp.x - 18, y: bp.y - 130 - drop, z: 0, zAxis: -tw }, { x: bp.x + 18, y: bp.y - 130 - drop, z: 0, zAxis: -tw },
    { x: bp.x + 18, y: bp.y - 130 - drop, z: 0, zAxis: tw }, { x: bp.x - 18, y: bp.y - 130 - drop, z: 0, zAxis: tw }
  ].map(p => isoProject(p, yaw, scale, ox, oy));
  polygonPath(ctx, punchPts); ctx.fillStyle = 'rgba(110,118,126,.6)'; ctx.fill(); ctx.stroke();

  ctx.fillStyle = css('--text2'); ctx.font = '12px Segoe UI, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(t('dragHint'), 16, h - 16);
}

/* ---------- рендер сцены ---------- */
function renderScene() {
  const angles = currentAngles();
  document.querySelectorAll('canvas.scene-canvas').forEach(c => {
    if (c.offsetParent === null) return;
    if (c.dataset.view === '3d') draw3D(c, angles); else draw2D(c, angles);
  });
  renderSequence(); renderStatus();
}
function setView(v) {
  state.view = v;
  document.querySelectorAll('canvas.scene-canvas').forEach(c => c.classList.toggle('active', c.dataset.view === v));
  renderScene();
}
function currentAngles() {
  const a = activeAngles().slice();
  if (state.anim.active && a.length) {
    const target = a[state.anim.index];
    a[state.anim.index] = 180 - (180 - target) * state.anim.progress;
  }
  return a;
}

/* ---------- интерфейс: деталь ---------- */
function renderProfileSelect() {
  const sel = document.getElementById('profileSel');
  sel.innerHTML = Object.keys(PROFILES).map(k => `<option value="${k}" ${k === state.profile ? 'selected' : ''}>${PROFILES[k][LANG]}</option>`).join('');
}
function renderProfileInputs() {
  const host = document.getElementById('profileInputs');
  const pr = profile();
  host.innerHTML = `
    <div class="grid4">
      <label>${t('thickness')}<input id="inS" type="number" step="0.1" min="0.3" value="${state.s}"></label>
      <label>${t('radius')}<input id="inR" type="number" step="0.1" min="0" value="${state.R}"></label>
      <label>${t('kfactor')}<input id="inK" type="number" step="0.01" min="0.1" max="0.5" value="${state.K}"></label>
      <label>${t('length')}<input id="inL" type="number" step="10" min="10" value="${state.L}"></label>
    </div>
    <div class="sep"></div>
    <div class="row-head"><b>${t('flange')}</b><b>${t('angle')}</b></div>
    <div id="dimRows">${pr.dims.map((name, i) => `
      <div class="dimrow">
        <span class="tag">${name}</span>
        <input class="dim" data-i="${i}" type="number" min="1" step="1" value="${activeDims()[i] || 0}">
        ${i < pr.bends.length ? `<input class="ang" data-i="${i}" type="number" min="1" max="179" step="1" value="${activeAngles()[i]}">` : '<span></span>'}
      </div>`).join('')}
    </div>`;
  host.querySelector('#inS').oninput = e => { state.s = +e.target.value || 1; renderScene(); };
  host.querySelector('#inR').oninput = e => { state.R = +e.target.value || 0; renderScene(); };
  host.querySelector('#inK').oninput = e => { state.K = +e.target.value || 0.42; renderCalc(); };
  host.querySelector('#inL').oninput = e => { state.L = +e.target.value || 100; renderScene(); };
  host.querySelectorAll('.dim').forEach(el => el.oninput = e => { state.dims[+e.target.dataset.i] = +e.target.value || 1; renderScene(); renderCalc(); });
  host.querySelectorAll('.ang').forEach(el => el.oninput = e => { state.angles[+e.target.dataset.i] = +e.target.value || 90; renderScene(); renderCalc(); });
}

/* ---------- гибка ---------- */
function renderSequence() {
  const host = document.getElementById('sequenceList'); if (!host) return;
  const bends = profile().bends;
  host.innerHTML = bends.map((b, i) => `
    <div class="seq ${state.anim.active && state.anim.index === i ? 'active' : ''}">
      <span class="tag">${String.fromCharCode(65 + i)}</span>
      <span>${t('bend')} ${i + 1}</span>
      <b>${activeAngles()[i]}${t('deg')}</b>
      <button class="mini" data-seq="${i}" title="${t('step')}">▶</button>
    </div>`).join('');
  host.querySelectorAll('button').forEach(btn => btn.onclick = () => startAnim(+btn.dataset.seq));
}
function startAnim(index) {
  stopAnim();
  state.anim = { active: true, index, progress: 0, raf: null };
  const t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0) / 1400);
    state.anim.progress = p;
    renderScene();
    if (p < 1) state.anim.raf = requestAnimationFrame(tick);
    else { state.anim.active = false; state.anim.progress = 0; renderScene(); }
  };
  state.anim.raf = requestAnimationFrame(tick);
}
function stopAnim() {
  if (state.anim.raf) cancelAnimationFrame(state.anim.raf);
  state.anim.active = false; state.anim.progress = 0;
}
function autoSequence() {
  const idx = activeAngles().map((a, i) => [i, Math.abs(180 - a)]).sort((x, y) => y[1] - x[1]).map(x => x[0]);
  const host = document.getElementById('sequenceList');
  const items = Array.from(host.children);
  idx.forEach((i, n) => host.appendChild(items[i]));
  renderSequence();
}

/* ---------- инструмент ---------- */
function buildTools() {
  const punches = [], dies = [];
  [30, 45, 60, 88, 90].forEach(a => [0.5, 1, 2, 3, 5].forEach(r =>
    punches.push({ id: 'P-' + a + '-R' + r, type: 'punch', angle: a, radius: r, name: 'P ' + a + '° R' + r })));
  [4, 6, 8, 10, 12, 16, 20, 25, 32, 40].forEach(v =>
    dies.push({ id: 'D-' + v, type: 'die', V: v, angle: 88, name: 'D V' + v }));
  return { punches, dies };
}
const TOOLS = buildTools();
function renderTools() {
  ['punch', 'die'].forEach(kind => {
    const host = document.getElementById(kind + 'List'); if (!host) return;
    const q = (document.getElementById(kind + 'Search')?.value || '').toLowerCase();
    let list = TOOLS[kind === 'punch' ? 'punches' : 'dies'];
    if (state.favOnly) list = list.filter(x => state.favourites.has(x.id));
    if (q) list = list.filter(x => x.name.toLowerCase().includes(q) || x.id.toLowerCase().includes(q));
    host.innerHTML = list.map(x => `
      <div class="tool ${state[kind] && state[kind].id === x.id ? 'sel' : ''}" data-id="${x.id}">
        <button class="star ${state.favourites.has(x.id) ? 'on' : ''}" data-star="${x.id}">★</button>
        <span class="tname">${x.name}</span>
        <span class="tmeta">${x.type === 'punch' ? 'R' + x.radius : 'V' + x.V}</span>
      </div>`).join('') || `<div class="muted">${t('noData')}</div>`;
    host.querySelectorAll('.tool').forEach(el => el.onclick = () => {
      state[kind] = TOOLS[kind === 'punch' ? 'punches' : 'dies'].find(x => x.id === el.dataset.id);
      renderTools(); renderStatus(); renderScene();
    });
    host.querySelectorAll('.star').forEach(el => el.onclick = e => {
      e.stopPropagation();
      state.favourites.has(el.dataset.star) ? state.favourites.delete(el.dataset.star) : state.favourites.add(el.dataset.star);
      renderTools();
    });
  });
}
function autoTools() {
  const A = activeAngles()[0] || 90;
  state.punch = TOOLS.punches.find(p => Math.abs(p.angle - A) < 3 && Math.abs(p.radius - state.R) < 1) || TOOLS.punches[3];
  const v = Math.round((8 * state.s) / 2) * 2;
  state.die = TOOLS.dies.find(d => d.V === v) || TOOLS.dies.find(d => d.V === 12);
  state.machine.V = state.die.V;
  renderTools(); renderStatus(); renderScene();
}

/* ---------- статус ---------- */
function renderStatus() {
  const host = document.getElementById('statusBox'); if (!host) return;
  const V = state.die ? state.die.V : state.machine.V;
  const A = activeAngles()[0] || 90;
  let level = 'ok', msg = t('ok'), detail = [];
  if (state.R < state.s / 2) { level = 'fail'; msg = t('fail'); detail.push('R < s/2'); }
  if (V < 5 * state.s) { if (level === 'ok') { level = 'warn'; msg = t('warn'); } detail.push('V < 5s'); }
  if (state.punch && state.punch.angle > A + 2) { level = 'fail'; msg = t('fail'); detail.push('punch angle > bend angle'); }
  if (state.machine.gauge < Math.min(...activeDims())) { if (level === 'ok') { level = 'warn'; msg = t('warn'); } detail.push('gauge < min flange'); }
  host.className = 'status ' + level;
  host.innerHTML = `<b>${msg}</b><span>${detail.length ? detail.join(' · ') : t('ok')}</span>`;
}

/* ---------- расчёт ---------- */
function calcFlat() {
  const angs = activeAngles(), dims = activeDims();
  let total = dims.reduce((a, b) => a + b, 0), pos = dims[0], table = [];
  angs.forEach((A, i) => {
    const sweep = 180 - A;
    const ba = Math.PI * sweep / 180 * (state.R + state.K * state.s);
    const bd = 2 * (state.R + state.s) - ba;
    total += ba;
    table.push({ bend: i + 1, A, ba, bd, ossb: state.R + state.s, coord: pos + ba / 2 });
    pos += dims[i + 1] + ba;
  });
  return { total, table };
}
function renderCalc() {
  const { total, table } = calcFlat();
  const el = document.getElementById('totalLen'); if (el) el.textContent = total.toFixed(2) + ' ' + t('mm');
  const tb = document.getElementById('calcTable'); if (tb) tb.innerHTML = `
    <tr><th>${t('bend')}</th><th>${t('angle')}</th><th>${t('bendAllowance')}</th><th>${t('bendDeduction')}</th><th>${t('ossb')}</th><th>${t('coordinate')}</th></tr>
    ${table.map(r => `<tr><td>${r.bend}</td><td>${r.A}°</td><td>${r.ba.toFixed(2)}</td><td>${r.bd.toFixed(2)}</td><td>${r.ossb.toFixed(2)}</td><td>${r.coord.toFixed(2)}</td></tr>`).join('')}`;
}
function reverseK() {
  const measured = +document.getElementById('measured').value || 0;
  const angs = activeAngles(), dims = activeDims();
  const sweepSum = angs.reduce((a, A) => a + (180 - A), 0);
  const base = dims.reduce((a, b) => a + b, 0) + Math.PI / 180 * sweepSum * state.R;
  const k = (measured - base) / (Math.PI / 180 * sweepSum * state.s);
  document.getElementById('kResult').textContent = k.toFixed(3);
}

/* ---------- документы ---------- */
function exportText(ext) {
  const { total, table } = calcFlat();
  const lines = [
    'GibGib Sim — Web Edition 3.4.0', '',
    'Profile: ' + (PROFILES[state.profile][LANG]),
    's=' + state.s + ' mm  R=' + state.R + ' mm  K=' + state.K + '  L=' + state.L + ' mm',
    'Punch: ' + (state.punch ? state.punch.name : '-'),
    'Die: ' + (state.die ? state.die.name : '-'),
    'Dimensions: ' + activeDims().join(' / '),
    'Angles: ' + activeAngles().join(' / '), '',
    'Flat length: ' + total.toFixed(2) + ' mm', '',
    'Bend\tAngle\tBA\tBD\tOSSB\tCoordinate',
    ...table.map(r => [r.bend, r.A, r.ba.toFixed(2), r.bd.toFixed(2), r.ossb.toFixed(2), r.coord.toFixed(2)].join('\t')),
    '', 'Reference tool. Not a machine control system.'
  ];
  let text = lines.join('\n'), mime = 'text/plain', name = 'GibGib-Sim-3.4.0.txt';
  if (ext === 'csv') { text = lines.map(l => '"' + l.replace(/"/g, '""') + '"').join('\n'); mime = 'text/csv'; name = 'GibGib-Sim-3.4.0.csv'; }
  if (ext === 'rtf') { text = '{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Segoe UI;}}\\f0\\fs22 ' + lines.join('\\par ') + '}'; mime = 'application/rtf'; name = 'GibGib-Sim-3.4.0.rtf'; }
  download(new Blob([text], { type: mime }), name);
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function drawDrawing() {
  const canvas = document.getElementById('drawingCanvas');
  const { ctx, w, h } = setupCanvas(canvas);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.strokeRect(16, 16, w - 32, h - 32);
  ctx.fillStyle = '#111'; ctx.font = 'bold 20px Segoe UI, sans-serif';
  ctx.fillText('GibGib Sim 3.4.0 — ' + (PROFILES[state.profile][LANG]), 34, 50);
  ctx.font = '13px Segoe UI, sans-serif';
  const { total, table } = calcFlat();
  ctx.fillText('s=' + state.s + '  R=' + state.R + '  K=' + state.K + '  L=' + state.L + '  Flat=' + total.toFixed(2), 34, 74);
  // сечение
  const cl = centerline(); const tr = fitTransform(cl, w * 0.55, h * 0.55, 60);
  tr.ox = w * 0.28 + state.panX; tr.oy = h * 0.5 + state.panY;
  const outer = offsetPolyline(cl, state.s / 2).map(p => project(p, tr));
  const inner = offsetPolyline(cl, -state.s / 2).map(p => project(p, tr));
  polygonPath(ctx, outer.concat(inner.slice().reverse()));
  ctx.fillStyle = '#f60'; ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
  // таблица
  let y = 120;
  ctx.font = '12px Segoe UI, sans-serif'; ctx.fillStyle = '#111';
  table.forEach(r => { ctx.fillText(`Гиб ${r.bend}: ${r.A}°   BA=${r.ba.toFixed(2)}   BD=${r.bd.toFixed(2)}   X=${r.coord.toFixed(2)}`, w * 0.58, y); y += 24; });
  ctx.fillText('s = ' + state.s + ' mm  ·  R = ' + state.R + ' mm  ·  K = ' + state.K, w * 0.58, y + 14);
  ctx.font = '11px Segoe UI, sans-serif'; ctx.fillStyle = '#666';
  ctx.fillText('Reference drawing. Verify against real drawings before bending.', 34, h - 34);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.strokeRect(w - 260, h - 90, 230, 60);
  ctx.fillStyle = '#111'; ctx.font = '12px Segoe UI, sans-serif';
  ctx.fillText('GibGib Sim — 3.4.0', w - 250, h - 66); ctx.fillText('© 2026 @Frikks', w - 250, h - 46);
}
function saveDrawing() {
  drawDrawing();
  const a = document.createElement('a');
  a.href = document.getElementById('drawingCanvas').toDataURL('image/png');
  a.download = 'GibGib-Sim-3.4.0-drawing.png'; a.click();
}

/* ---------- вкладки ---------- */
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'docs') drawDrawing();
  if (tab === 'part' || tab === 'bend') renderScene();
  if (tab === 'calc') renderCalc();
}

/* ---------- инициализация ---------- */
function init() {
  renderProfileSelect(); renderProfileInputs(); renderTools(); renderCalc(); applyI18n();
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  document.getElementById('profileSel').onchange = e => {
    state.profile = e.target.value;
    state.angles = profile().bends.map(b => b[0]);
    stopAnim(); renderProfileInputs(); renderScene(); renderCalc();
  };
  document.getElementById('btnLang').onclick = () => { LANG = LANG === 'ru' ? 'en' : 'ru'; applyI18n(); renderProfileSelect(); };
  document.getElementById('btnTheme').onclick = () => {
    THEME = THEME === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = THEME;
    renderScene(); drawDrawing();
  };
  document.getElementById('btnSim').onclick = () => startAnim(0);
  document.getElementById('btnStop').onclick = () => { stopAnim(); renderScene(); };
  document.getElementById('btnAutoSeq').onclick = autoSequence;
  document.getElementById('btnAutoTools').onclick = autoTools;
  document.getElementById('btnReverse').onclick = reverseK;
  ['txt', 'csv', 'rtf'].forEach(e => document.getElementById('exp-' + e).onclick = () => exportText(e));
  document.getElementById('btnPrint').onclick = () => { drawDrawing(); window.print(); };
  document.getElementById('btnPng').onclick = saveDrawing;
  document.getElementById('favOnly').onchange = e => { state.favOnly = e.target.checked; renderTools(); };
  document.getElementById('punchSearch').oninput = renderTools;
  document.getElementById('dieSearch').oninput = renderTools;
  document.querySelectorAll('[data-setview]').forEach(b => b.onclick = () => setView(b.dataset.setview));
  // управление 3D
  let drag = false, lx = 0;
  document.querySelectorAll('canvas.scene-canvas').forEach(c3 => {
    c3.addEventListener('mousedown', e => { drag = true; lx = e.clientX; });
    c3.addEventListener('wheel', e => { e.preventDefault(); state.zoom = Math.max(0.4, Math.min(2.5, state.zoom * (e.deltaY > 0 ? 0.92 : 1.08))); renderScene(); }, { passive: false });
  });
  window.addEventListener('mouseup', () => drag = false);
  window.addEventListener('mousemove', e => { if (drag) { state.yaw += (e.clientX - lx) * 0.008; lx = e.clientX; renderScene(); } });
  window.addEventListener('resize', () => { renderScene(); if (state.tab === 'docs') drawDrawing(); });
  renderScene(); switchTab('part');
}
document.addEventListener('DOMContentLoaded', init);

</script>
