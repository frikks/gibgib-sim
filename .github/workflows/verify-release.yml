name: Verify release files

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify web edition SHA-256
        run: |
          expected="ba1e87c82d7a86acc466f9b5b429dc3d505f5af44beaa66d04c973709f4b573e"
          actual="$(sha256sum GibGib-Sim-3.4.0.html | cut -d' ' -f1)"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Verify checksum references in docs
        run: |
          expected="ba1e87c82d7a86acc466f9b5b429dc3d505f5af44beaa66d04c973709f4b573e"
          grep -q "$expected" README.md
          grep -q "$expected" CHANGELOG.md
          if grep -q "70f71669" README.md CHANGELOG.md; then
            echo "Old checksum found in docs" >&2
            exit 1
          fi

      - name: Verify relative links
        run: python3 .github/scripts/check_links.py
